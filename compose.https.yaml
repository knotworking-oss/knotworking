# HTTPS add-on for compose.yaml: also publishes port 443 so Caddy can serve HTTPS and
# obtain Let's Encrypt certificates for DOMAIN. Only load it when DOMAIN is set.
#
#   # deploy/.env
#   DOMAIN=knotworking.example.com
#   HTTP_PORT=80
#   COMPOSE_FILE=compose.yaml:compose.https.yaml
#
# or pass both files explicitly: docker compose -f compose.yaml -f compose.https.yaml ...
# See docs/self-hosting.md.
services:
  caddy:
    environment:
      # Fails early instead of silently serving plain HTTP on a typo'd setup.
      SITE_ADDRESS: ${DOMAIN:?Set DOMAIN in deploy/.env to use compose.https.yaml}
    ports:
      - "${HTTPS_PORT:-443}:443"
