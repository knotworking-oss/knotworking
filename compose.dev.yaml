# Development only: a local Postgres server instead of the embedded PGlite.
#   docker compose -f compose.dev.yaml up -d
#   DATABASE_URL=postgres://postgres:postgres@localhost:5432/knotworking
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: knotworking
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - knotworking-dev-pg:/var/lib/postgresql/data
volumes:
  knotworking-dev-pg:
