[package]
name = "knotworking-desktop"
version = "0.1.0"
description = "Knotworking desktop app"
edition = "2021"
publish = false
license = "Apache-2.0"

[lib]
# The `_lib` suffix avoids a name clash with the binary on Windows (cargo#8519).
name = "knotworking_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = [] }
tauri-plugin-opener = "2.7"
tauri-plugin-window-state = "2.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
